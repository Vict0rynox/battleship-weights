<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1220" />
    <title>Battleship · Experiment lab</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#experiments"
        ><span class="brand-icon">▦</span
        ><span>BATTLESHIP<small>EXPERIMENT LAB</small></span></a
      >
      <p class="nav-label">WORKSPACE</p>
      <nav aria-label="Main navigation">
        <a href="#experiments" data-view="experiments"
          >◈ <span>Experiments</span></a
        ><a href="#results" data-view="results">▥ <span>Results</span></a
        ><a href="#viewer" data-view="viewer">▦ <span>Game viewer</span></a
        ><a href="#new" data-view="new">＋ <span>New game</span></a>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span> Local research workspace<small

        >
      </div>

      <header class="topbar">
        <span

      <main id="app" tabindex="-1"></main>
      <footer>
        10 × 10 board <span>•</span> Five ships <span>•</span> One shot per turn
        <span class="footer-right">BATTLESHIP / RESEARCH LAB</span>
      </footer>
    </div>
    <div id="toast" role="status" hidden></div>
    <div id="error" role="alert" hidden></div>
