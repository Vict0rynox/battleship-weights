[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-protocol"
version = "1.0.0"
description = "Public Battleship player protocol, without engine implementation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]
