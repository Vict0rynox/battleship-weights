[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-server"
version = "1.0.0"
description = "Authoritative Battleship engine and local HTTP server"
requires-python = ">=3.10"
dependencies = ["battleship-protocol==1.0.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
battleship-server = "battleship_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battleship_server = ["static/*.html", "static/*.css", "static/*.js"]
