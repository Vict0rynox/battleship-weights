[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-client"
version = "1.0.0"
description = "Standalone Battleship player SDK, terminal client and baseline bots"
requires-python = ">=3.10"
dependencies = ["battleship-protocol==1.0.0", "httpx>=0.27,<1"]

[project.optional-dependencies]
weights = ["numpy>=1.26,<3"]

[project.scripts]
battleship = "battleship_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
